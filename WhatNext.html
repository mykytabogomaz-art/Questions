<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Доповни речення</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one calm column. Header names the task, then progress dots, one task card (picture → ?, the first half of the sentence, a writing line for the second half), and a single «Далі» button that never moves. Blue = start of the sentence, green = what the child writes. */
:root {
  --bg: #F1F4F8;
  --surface: #FFFFFF;
  --stage: #E6ECF4;
  --ink: #1B2432;
  --muted: #5A6678;
  --line: #D2DAE5;
  --why: #2B55D6;
  --why-soft: #E2E9FD;
  --on-why: #FFFFFF;
  --because: #0E7A58;
  --because-soft: #D9F2E8;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151C;
    --surface: #1A212C;
    --stage: #232C3A;
    --ink: #E9EDF3;
    --muted: #A1ADBF;
    --line: #303A4A;
    --why: #97ADFF;
    --why-soft: #222D52;
    --on-why: #0F1530;
    --because: #5ED4A7;
    --because-soft: #16392E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151C;
  --surface: #1A212C;
  --stage: #232C3A;
  --ink: #E9EDF3;
  --muted: #A1ADBF;
  --line: #303A4A;
  --why: #97ADFF;
  --why-soft: #222D52;
  --on-why: #0F1530;
  --because: #5ED4A7;
  --because-soft: #16392E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
}
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--why); outline-offset: 2px; }

.app {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.eyebrow { margin: 0 0 6px; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pair { margin: 0; font: 700 clamp(1.25rem, 5.6vw, 1.7rem)/1.2 var(--font-display); color: var(--why); text-wrap: balance; }
.today { margin: 0; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.today b { color: var(--ink); font-variant-numeric: tabular-nums; }
.lead { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }

/* progress */
.progress { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.count { margin: 0; font-size: .9rem; color: var(--muted); }
.count b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.dot.done { background: var(--because); border-color: var(--because); }
.dot.now { border-color: var(--why); box-shadow: 0 0 0 3px var(--why-soft); }

/* card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.task { display: flex; flex-direction: column; gap: 14px; }
.cat { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stage {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 12px;
  min-height: 150px; padding: 18px 12px; background: var(--stage); border-radius: 14px;
}
.em { font-family: var(--font-emoji); font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1; }
.arrow { font-size: clamp(1.6rem, 7vw, 2.4rem); color: var(--muted); line-height: 1; }
.ask {
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(3.2rem, 14vw, 4.8rem); aspect-ratio: 1; max-width: 100%;
  font: 700 clamp(1.8rem, 8vw, 2.8rem)/1 var(--font-display);
  color: var(--why); border: 3px dashed var(--why); border-radius: 16px;
}
.start { margin: 0; font-size: clamp(1.3rem, 5.6vw, 1.65rem); font-weight: 600; line-height: 1.4; }
.why { display: inline-block; padding: 0 .3em; border-radius: 8px; background: var(--why-soft); color: var(--why); font-weight: 700; }

/* writing line */
.write { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.write .tm { font-size: 1.25rem; font-weight: 700; color: var(--because); }
.write input {
  flex: 1 1 11rem; min-width: 0; height: 56px; padding: 0 14px;
  font-size: 1.2rem; font-weight: 500;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--because); border-radius: 12px;
}
.write .end { font-size: 1.25rem; font-weight: 700; color: var(--because); }

/* navigation: Назад (quiet) and Далі (main) */
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
.btn {
  min-height: 56px; padding: 0 20px;
  font-size: 1.1rem; font-weight: 700;
  background: var(--why); color: var(--on-why);
  border: 2px solid var(--why); border-radius: 12px; cursor: pointer;
}
.btn.back { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }

/* summary */
.sum h2 { margin: 0; font: 700 1.4rem/1.2 var(--font-display); }
.stat { padding: 14px; background: var(--stage); border-radius: 12px; }
.stat b { display: block; font: 700 2rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .9rem; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .dot { transition: background-color .12s, border-color .12s; }
}
</style>

<div class="app" lang="uk">
  <header class="top">
    <div>
      <p class="eyebrow">Практика відповідей</p>
      <h1 class="pair">Доповни речення</h1>
    </div>
    <p class="today">Сьогодні: <b id="todayCount">0</b></p>
  </header>
  <p class="lead">Закінчи речення вголос і напиши закінчення.</p>

  <section class="progress" aria-label="Прогрес">
    <p class="count">Завдання <b id="cur">1</b> з <span id="total">20</span></p>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <main class="card">
    <div id="task" class="task">
      <span class="cat" id="cat"></span>
      <div class="stage" id="stage" role="img"></div>
      <p class="start" id="start"></p>
      <div class="write">
        <span class="tm" id="link">а потім</span>
        <input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Закінчення речення після слів «а потім»">
        <span class="end">.</span>
      </div>
    </div>
    <div id="summary" class="task sum" hidden></div>
  </main>

  <div class="nav">
    <button type="button" class="btn back" id="back">Назад</button>
    <button type="button" class="btn" id="next">Далі</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ITEMS = [
    { cat: "Вдома", scene: ["🧑", "🫖", "🔥"], alt: "Хлопець, чайник і вогонь на плиті.", first: "хлопець увімкнув чайник", link: "а потім" },
    { cat: "Вдома", scene: ["👩", "💡", "🚫"], alt: "Дівчина і лампа, яку вимкнули.", first: "дівчина вимкнула світло в кімнаті", link: "і" },
    { cat: "Вдома", scene: ["👩", "☕", "⬇️"], alt: "Дівчина, чашка летить вниз.", first: "дівчина випустила чашку з рук", link: "і" },
    { cat: "Вдома", scene: ["🧑", "🍞", "🔌"], alt: "Хлопець, хліб і тостер.", first: "хлопець поклав хліб у тостер", link: "а потім" },
    { cat: "Вдома", scene: ["🧑", "📱", "🔌"], alt: "Хлопець, телефон і зарядка.", first: "хлопець поставив телефон на зарядку", link: "і" },
    { cat: "Вдома", scene: ["👩", "🔑", "🚪"], alt: "Дівчина, ключ і двері.", first: "дівчина вставила ключ у двері", link: "а потім" },
    { cat: "Вдома", scene: ["🧑", "🔔", "🚪"], alt: "Хлопець, дзвінок і двері.", first: "хлопець натиснув на дзвінок біля дверей", link: "і" },
    { cat: "Вдома", scene: ["👩", "🚰", "💧"], alt: "Дівчина і кран з краплями.", first: "дівчина відкрила кран", link: "а потім" },

    { cat: "Надворі", scene: ["🧑", "🪨", "🌊"], alt: "Хлопець, камінець і вода.", first: "хлопець кинув камінець у воду", link: "і" },
    { cat: "Надворі", scene: ["👩", "🌧️"], alt: "Дівчина під дощем без парасольки.", first: "дівчина вийшла під дощ без парасольки", link: "і" },
    { cat: "Надворі", scene: ["🧑", "🍦", "☀️"], alt: "Хлопець, морозиво і яскраве сонце.", first: "хлопець залишив морозиво на сонці", link: "і" },
    { cat: "Надворі", scene: ["🧑", "🚌"], alt: "Хлопець і автобус.", first: "хлопець сів в автобус", link: "а потім" },
    { cat: "Надворі", scene: ["🚦", "🟢", "🚶"], alt: "Світлофор із зеленим світлом і людина.", first: "на світлофорі загорілося зелене світло", link: "і" },
    { cat: "Надворі", scene: ["🧑", "🚲", "💥"], alt: "Хлопець, велосипед і удар.", first: "хлопець упав з велосипеда", link: "і" },
    { cat: "Надворі", scene: ["👩", "🌱", "💦"], alt: "Дівчина, паросток і вода.", first: "дівчина посадила насіння", link: "а потім" },

    { cat: "Школа, свято, спорт", scene: ["🔔", "🏫", "📓"], alt: "Дзвоник, школа і зошит.", first: "пролунав дзвоник з уроку", link: "і" },
    { cat: "Школа, свято, спорт", scene: ["👩", "🎂", "🕯️"], alt: "Дівчина, торт і свічки.", first: "дівчина задула свічки на торті", link: "а потім" },
    { cat: "Школа, свято, спорт", scene: ["👩", "⚽", "🥅"], alt: "Дівчина, футбольний м’яч і ворота.", first: "дівчина вдарила по м’ячу", link: "і" },
    { cat: "Школа, свято, спорт", scene: ["🏃", "🏁", "🥇"], alt: "Бігун, фініш і золота медаль.", first: "хлопець перетнув фінішну лінію першим", link: "і" }
  ];

  /* light per-device convenience: today's counter */
  var KEY = "next-trainer-v1";
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
  function saveStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function dayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  if (store.day !== dayKey()) { store.day = dayKey(); store.count = 0; }

  function blank() { return ITEMS.map(function () { return false; }); }
  var state = { i: 0, done: blank(), typed: ITEMS.map(function () { return ""; }) };

  var $ = function (id) { return document.getElementById(id); };
  var todayEl = $("todayCount"), curEl = $("cur"), totalEl = $("total"), dotsEl = $("dots"),
      taskEl = $("task"), summaryEl = $("summary"), catEl = $("cat"), stage = $("stage"),
      startEl = $("start"), linkEl = $("link"), input = $("answer"), nextBtn = $("next"), backBtn = $("back");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function drawDots() {
    dotsEl.innerHTML = "";
    ITEMS.forEach(function (_, k) {
      var cls = "dot" + (state.done[k] ? " done" : "") + (k === state.i ? " now" : "");
      dotsEl.appendChild(el("span", cls));
    });
  }

  function showTask() {
    taskEl.hidden = false;
    summaryEl.hidden = true;
    var it = ITEMS[state.i];

    catEl.textContent = it.cat;
    stage.innerHTML = "";
    stage.setAttribute("aria-label", it.alt);
    it.scene.forEach(function (e) {
      var s = el("span", "em", e);
      s.setAttribute("aria-hidden", "true");
      stage.appendChild(s);
    });
    var arrow = el("span", "arrow", "→");
    arrow.setAttribute("aria-hidden", "true");
    stage.appendChild(arrow);
    var ask = el("span", "ask", "?");
    ask.setAttribute("aria-hidden", "true");
    stage.appendChild(ask);

    startEl.innerHTML = "";
    if (it.link === "а потім") {
      startEl.appendChild(el("span", "why", "Спочатку"));
      startEl.appendChild(document.createTextNode(" " + it.first + ","));
    } else {
      startEl.appendChild(document.createTextNode(it.first.charAt(0).toUpperCase() + it.first.slice(1) + ","));
    }
    linkEl.textContent = it.link;
    input.setAttribute("aria-label", "Закінчення речення після слова «" + it.link + "»");

    input.value = state.typed[state.i] || "";
    nextBtn.textContent = state.i === ITEMS.length - 1 ? "Завершити" : "Далі";
    backBtn.disabled = state.i === 0;
  }

  function showSummary() {
    taskEl.hidden = true;
    summaryEl.hidden = false;
    var n = state.done.filter(Boolean).length;

    summaryEl.innerHTML = "";
    summaryEl.appendChild(el("h2", null, "Готово"));
    var s = el("div", "stat");
    s.appendChild(el("b", null, n + " з " + ITEMS.length));
    s.appendChild(el("span", null, "речень дописано"));
    summaryEl.appendChild(s);
    nextBtn.textContent = "Ще раз";
    backBtn.disabled = false;
  }

  function render() {
    totalEl.textContent = ITEMS.length;
    curEl.textContent = Math.min(state.i + 1, ITEMS.length);
    todayEl.textContent = store.count || 0;
    drawDots();
    if (state.i >= ITEMS.length) showSummary(); else showTask();
  }

  nextBtn.addEventListener("click", function () {
    if (state.i >= ITEMS.length) {
      state.i = 0;
      state.done = blank();
      state.typed = ITEMS.map(function () { return ""; });
    } else {
      /* the text itself is never checked; writing something counts as an answer */
      state.typed[state.i] = input.value;
      if (input.value.trim()) {
        if (!state.done[state.i]) {
          store.count = (store.count || 0) + 1;
          saveStore();
        }
        state.done[state.i] = true;
      }
      state.i++;
    }
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  });

  backBtn.addEventListener("click", function () {
    if (state.i === 0) return;
    if (state.i < ITEMS.length) state.typed[state.i] = input.value;
    state.i--;
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  });

  render();
})();
</script>

</body></html>
