<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Види транспорту</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f3f5f9;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }
  .progress { font-size: 14px; color: #6b7280; margin-bottom: 8px; }
  .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar span { display: block; height: 100%; width: 0; background: #0ea5e9; transition: width .25s; }

  .images { display: flex; gap: 16px; margin-bottom: 24px; }
  .image-box {
    flex: 1;
    aspect-ratio: 1 / 1;
    max-height: 220px;
    border-radius: 12px;
    display: flex;
    align-items: center; justify-content: center;
    overflow: hidden;
    padding: 8px;
  }
  .image-box.ground { background: #ecfdf5; }
  .image-box.water  { background: #eff6ff; }
  .image-box.air    { background: #f5f3ff; }
  .image-box .emoji { font-size: 88px; line-height: 1; }
  .image-box svg { width: 78%; max-width: 160px; height: auto; }
  .image-box img { width: 100%; height: 100%; object-fit: cover; }

  .question { margin-bottom: 20px; }
  .question label { display: block; font-weight: 400; font-size: 17px; margin-bottom: 8px; }
  .question label b { font-weight: 700; }
  .question input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
  }
  .question input:focus { outline: 2px solid #bae6fd; border-color: #0ea5e9; }

  .nav { display: flex; justify-content: space-between; margin-top: 8px; gap: 8px; }
  button {
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #0ea5e9;
    color: #fff;
  }
  button:hover { background: #0284c7; }
  button:disabled { background: #c7c9d1; cursor: not-allowed; }
  button.secondary { background: #e5e7eb; color: #1f2937; }
  button.secondary:hover { background: #d1d5db; }
  button.secondary:disabled { background: #f0f1f4; color: #a0a4ad; }

  .result { display: none; }
  .result h2 { margin-top: 0; }
  .result .item { border-top: 1px solid #e5e7eb; padding: 12px 0; }
  .result .item h3 { margin: 0 0 6px; font-size: 16px; }
  .result .item p { margin: 4px 0; font-size: 15px; }
  .result .empty { color: #9ca3af; }
</style>
</head>
<body>
<div class="card">
  <div id="quiz">
    <div class="progress" id="progress"></div>
    <div class="bar"><span id="bar"></span></div>

    <div class="images">
      <div class="image-box" id="img1"></div>
      <div class="image-box" id="img2"></div>
    </div>

    <div class="question">
      <label id="qlabel" for="answer"></label>
      <input type="text" id="answer" placeholder="Ваша відповідь...">
    </div>

    <div class="nav">
      <button class="secondary" id="backBtn">← Назад</button>
      <button id="nextBtn">Далі →</button>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  const QUESTION_COUNT = 10;

  // Малюнки для транспорту, якого немає серед емодзі
  const SVG_AIRSHIP = `
    <svg viewBox="0 0 140 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M30 30L10 8h14l20 18z" fill="#475569"/>
      <path d="M30 50L10 72h14l20-18z" fill="#475569"/>
      <path d="M26 37L4 34v12l22-3z" fill="#475569"/>
      <ellipse cx="72" cy="40" rx="58" ry="22" fill="#94a3b8"/>
      <ellipse cx="80" cy="31" rx="40" ry="7" fill="#cbd5e1"/>
      <path d="M64 60v6M84 60v6" stroke="#334155" stroke-width="2"/>
      <rect x="58" y="65" width="32" height="11" rx="5" fill="#334155"/>
      <rect x="63" y="68" width="5" height="4" rx="1" fill="#e0f2fe"/>
      <rect x="72" y="68" width="5" height="4" rx="1" fill="#e0f2fe"/>
      <rect x="81" y="68" width="5" height="4" rx="1" fill="#e0f2fe"/>
    </svg>`;

  const SVG_BALLOON = `
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M50 4C22 4 8 26 14 52c4 17 22 28 28 38h16c6-10 24-21 28-38C92 26 78 4 50 4z" fill="#ef4444"/>
      <path d="M50 4C38 4 31 28 35 54c2 14 6 26 9 36h12c3-10 7-22 9-36C69 28 62 4 50 4z" fill="#facc15"/>
      <path d="M50 4C46 4 43 30 45 56c1 13 2 24 3 34h4c1-10 2-21 3-34C57 30 54 4 50 4z" fill="#ef4444"/>
      <rect x="41" y="87" width="18" height="4" rx="1" fill="#7f1d1d"/>
      <path d="M43 91l2 11M57 91l-2 11" stroke="#78350f" stroke-width="1.5"/>
      <rect x="42" y="102" width="16" height="13" rx="2" fill="#b45309"/>
    </svg>`;

  const categories = {
    ground: "Наземний транспорт",
    water:  "Водний транспорт",
    air:    "Повітряний транспорт"
  };

  // name — називний відмінок (хто? що?), gen — родовий (від кого? чого?)
  // Щоб показати справжню картинку, додайте поле img: "train.jpg"
  const vehicles = [
    { cat: "ground", name: "Потяг",          gen: "потяга",          emoji: "🚆" },
    { cat: "ground", name: "Автобус",        gen: "автобуса",        emoji: "🚌" },
    { cat: "ground", name: "Автомобіль",     gen: "автомобіля",      emoji: "🚗" },
    { cat: "ground", name: "Велосипед",      gen: "велосипеда",      emoji: "🚲" },
    { cat: "ground", name: "Трамвай",        gen: "трамвая",         emoji: "🚋" },
    { cat: "ground", name: "Мотоцикл",       gen: "мотоцикла",       emoji: "🏍️" },
    { cat: "ground", name: "Тролейбус",      gen: "тролейбуса",      emoji: "🚎" },

    { cat: "water",  name: "Корабель",       gen: "корабля",         emoji: "🚢" },
    { cat: "water",  name: "Човен",          gen: "човна",           emoji: "🛶" },
    { cat: "water",  name: "Яхта",           gen: "яхти",            emoji: "⛵" },
    { cat: "water",  name: "Катер",          gen: "катера",          emoji: "🚤" },
    { cat: "water",  name: "Пором",          gen: "порому",          emoji: "⛴️" },

    { cat: "air",    name: "Літак",          gen: "літака",          emoji: "✈️" },
    { cat: "air",    name: "Гелікоптер",     gen: "гелікоптера",     emoji: "🚁" },
    { cat: "air",    name: "Дирижабль",      gen: "дирижабля",       svg: SVG_AIRSHIP },
    { cat: "air",    name: "Повітряна куля", gen: "повітряної кулі", svg: SVG_BALLOON }
  ];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const pairKey = (x, y) => [x.name, y.name].sort().join("|");

  // Створює випадкові пари транспорту з різних категорій.
  // Кожна картинка з'являється якомога рідше: спершу беруться ті,
  // що ще не траплялися, тому жоден транспорт не повторюється частіше за інші.
  function makeQuestions(count) {
    let best = null;
    for (let attempt = 0; attempt < 100; attempt++) {
      const used = new Map(vehicles.map(v => [v, 0]));
      const pairs = new Set();
      const result = [];
      const byUsage = list => shuffle(list.slice()).sort((x, y) => used.get(x) - used.get(y));

      while (result.length < count) {
        const v1 = byUsage(vehicles)[0];
        const v2 = byUsage(vehicles.filter(v => v.cat !== v1.cat))
          .find(v => !pairs.has(pairKey(v1, v)));
        if (!v2) break;
        used.set(v1, used.get(v1) + 1);
        used.set(v2, used.get(v2) + 1);
        pairs.add(pairKey(v1, v2));
        result.push(Math.random() < 0.5 ? { a: v1, b: v2 } : { a: v2, b: v1 });
      }

      const maxUse = Math.max(...used.values());
      if (result.length === count && (!best || maxUse < best.maxUse)) best = { result, maxUse };
      if (best && best.maxUse <= Math.ceil(count * 2 / vehicles.length)) break;
    }
    return best.result;
  }

  const items = makeQuestions(QUESTION_COUNT);
  const answers = items.map(() => "");
  let current = 0;

  const $ = id => document.getElementById(id);

  function renderImage(box, v) {
    box.className = "image-box " + v.cat;
    if (v.img) box.innerHTML = `<img src="${v.img}" alt="">`;
    else if (v.svg) box.innerHTML = v.svg;
    else box.innerHTML = `<div class="emoji" aria-hidden="true">${v.emoji}</div>`;
  }

  function show() {
    const it = items[current];
    $("progress").textContent = `Питання ${current + 1} з ${items.length}`;
    $("bar").style.width = ((current + 1) / items.length * 100) + "%";

    renderImage($("img1"), it.a);
    renderImage($("img2"), it.b);

    $("qlabel").innerHTML = `Чим <b>відрізняється</b> ${it.a.name.toLowerCase()} від ${it.b.gen}?`;
    $("answer").value = answers[current];

    $("backBtn").disabled = current === 0;
    $("nextBtn").textContent = current === items.length - 1 ? "Завершити ✓" : "Далі →";
  }

  function save() { answers[current] = $("answer").value; }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function showResult() {
    const html = items.map((it, i) => {
      const a = answers[i].trim();
      return `<div class="item">
        <h3>${i + 1}. ${it.a.name} і ${it.b.name.toLowerCase()}</h3>
        <p><b>Відмінності:</b> ${a ? esc(a) : '<span class="empty">без відповіді</span>'}</p>
      </div>`;
    }).join("");
    $("result").innerHTML = `<h2>Ваші відповіді</h2>${html}
      <div class="nav">
        <button class="secondary" id="editBtn">← Повернутися</button>
        <button id="newBtn">Нові питання ↻</button>
      </div>`;
    $("quiz").style.display = "none";
    $("result").style.display = "block";
    $("editBtn").onclick = () => {
      $("result").style.display = "none";
      $("quiz").style.display = "block";
      show();
    };
    $("newBtn").onclick = () => location.reload();
  }

  $("backBtn").onclick = () => {
    save();
    if (current > 0) { current--; show(); }
  };

  $("nextBtn").onclick = () => {
    save();
    if (current < items.length - 1) { current++; show(); }
    else showResult();
  };

  $("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") $("nextBtn").click();
  });

  show();
</script>
</body>
</html>
